name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cargo-
    
    - name: Build
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Package
      run: |
        cd target/${{ matrix.target }}/release
        rm -f weeb-tui-${{ matrix.target }}.zip
        zip weeb-tui-${{ matrix.target }}.zip weeb-tui
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: weeb-tui-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/weeb-tui-${{ matrix.target }}.zip

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-windows-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-windows-cargo-
    
    - name: Build
      run: cargo build --release
    
    - name: Package
      shell: pwsh
      run: |
        $zipPath = "target/release/weeb-tui-windows-x86_64.zip"
        if (Test-Path $zipPath) { 
            Write-Host "Removing existing archive: $zipPath"
            Remove-Item $zipPath -Force 
        }
        Compress-Archive -Path "target/release/weeb-tui.exe" -DestinationPath $zipPath -Force
        Write-Host "Archive created successfully: $zipPath"
        Get-ChildItem $zipPath
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: weeb-tui-windows-x86_64
        path: target/release/weeb-tui-windows-x86_64.zip
        if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
    
    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-linux-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-linux-cargo-
    
    - name: Build
      run: cargo build --release
    
    - name: Package
      run: |
        cd target/release
        rm -f weeb-tui-linux-x86_64.tar.gz
        tar -czf weeb-tui-linux-x86_64.tar.gz weeb-tui
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: weeb-tui-linux-x86_64
        path: target/release/weeb-tui-linux-x86_64.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
          packaging/windows/install.ps1
        body: |
          ## Installation
          
          ### macOS
          ```bash
          # Using install script
          curl -fsSL https://raw.githubusercontent.com/silent9669/weeb-tui/main/packaging/macos/install.sh | bash
          
          # Or using Homebrew
          brew tap silent9669/tap
          brew install weeb-tui
          ```
          
          ### Windows
          ```powershell
          # Installs weeb-tui, verifies mpv, and configures ANI_TUI_PLAYER
          iwr -useb https://github.com/silent9669/weeb-tui/releases/latest/download/install.ps1 -OutFile install.ps1; .\install.ps1
          ```
          
          ### Linux
          ```bash
          curl -fsSL https://raw.githubusercontent.com/silent9669/weeb-tui/main/packaging/linux/install.sh | bash
          ```
          
          ## What's New
          See [CHANGELOG.md](https://github.com/silent9669/weeb-tui/blob/main/CHANGELOG.md) for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: release
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout weeb-tui
      uses: actions/checkout@v4

    - name: Checkout homebrew-tap
      uses: actions/checkout@v4
      with:
        repository: silent9669/homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: homebrew-tap

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Generate Homebrew formula
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        ruby scripts/generate-homebrew-formula.rb "$VERSION" homebrew-tap/Formula/weeb-tui.rb

    - name: Validate formula syntax
      run: |
        ruby -c homebrew-tap/Formula/weeb-tui.rb

    - name: Setup Homebrew tap
      run: |
        mkdir -p $(brew --repository)/Library/Taps/silent9669
        ln -s $(pwd)/homebrew-tap $(brew --repository)/Library/Taps/silent9669/homebrew-tap
        brew tap silent9669/tap

    - name: Test formula installation
      run: |
        brew install --build-from-source silent9669/tap/weeb-tui
        for i in 1 2 3; do
          if brew test weeb-tui; then
            break
          fi
          echo "brew test failed, attempt $i/3, retrying in 10s..."
          sleep 10
        done

    - name: Commit and push to homebrew-tap
      run: |
        cd homebrew-tap
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add Formula/weeb-tui.rb
        git diff --staged --quiet || git commit -m "Update weeb-tui to ${GITHUB_REF#refs/tags/}"
        git push
